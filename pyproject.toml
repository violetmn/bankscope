[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankscope"
version = "0.1.0"
description = "Evidence-first financial report research and evaluation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pdfplumber>=0.11,<1", "certifi>=2024.2.2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "pytest-cov>=6,<8"]
semantic = ["fastembed>=0.9,<1"]

[tool.setuptools.package-data]
bankscope = ["web/*.html", "web/*.css", "web/*.js"]

[project.scripts]
bankscope = "bankscope.cli:main"

[tool.setuptools.packages.find]
include = ["bankscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
